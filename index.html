<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#122c36"><title>うつろい — Smart Desk Clock</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23edbe78'/%3E%3Cpath d='M32 15V32L44 39' fill='none' stroke='%23122c36' stroke-width='5'/%3E%3C/svg%3E"><link rel="stylesheet" href="./src/style.css"></head>
<body>
<main class="clock" id="clock" data-night="true" data-weather="clear">
 <div class="sky" aria-hidden="true"><div class="stars"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="rain"></div><div class="land land-back"></div><div class="land land-front"></div></div>
 <section class="main-panel">
  <header><div class="brand"><span class="brand-mark">◷</span> うつろい <span class="brand-en">UTSUROI</span></div><div class="controls"><button id="location-button" class="location" aria-label="天気の地点を変更"><span class="pin">⌖</span> <span id="location-name">仙台</span></button><button id="fullscreen" class="icon-button" aria-label="全画面表示" title="全画面表示">⛶</button></div></header>
  <div class="time-block"><div id="date" class="date"></div><div class="time-line"><time id="time">--:--</time><span id="seconds">--</span></div><div class="seconds-track" aria-hidden="true"><div id="seconds-fill"></div></div></div>
  <div class="conditions"><span id="weather-icon" class="current-icon"></span><div class="temperature"><span id="temperature">--</span><span class="unit">°</span></div><div class="condition-detail"><div id="weather-label">天気を取得中</div><div class="high-low"><span id="high">↑ --°</span><span id="low">↓ --°</span></div></div><div class="humidity"><span class="drop">♧</span><span id="humidity">--</span><small>%</small><span class="metric-label">湿度</span></div></div>
  <div class="celestial"><div class="sun-section"><svg id="sun-path" viewBox="0 0 560 115" role="img" aria-label="日の出から日の入りまでの太陽の位置"><path d="M24 98 Q280 -68 536 98" class="orbit"/><path id="sun-progress" d="M24 98 Q280 -68 536 98" class="orbit-progress" pathLength="1"/><line x1="24" x2="536" y1="98" y2="98" class="horizon"/><circle id="sun-dot" cx="24" cy="98" r="8"/></svg><div class="sun-labels"><span>↗ <b id="sunrise">--:--</b><small>日の出</small></span><span class="day-phase" id="day-phase">夜の時間</span><span>↘ <b id="sunset">--:--</b><small>日の入り</small></span></div></div><div class="moon-section"><svg id="moon" viewBox="-1.1 -1.1 2.2 2.2" role="img" aria-label="月の満ち欠け"><circle r="1" fill="#ffffff18"/><path id="moon-light" fill="#eadfc6"/></svg><div><span id="moon-name">月</span><small id="moon-age">月齢 --</small></div></div></div>
  <footer><span id="status" role="status">天気を取得しています</span><a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Weather by Open-Meteo ↗</a></footer>
 </section>
 <aside class="forecast-panel" aria-label="今日の時間ごとの天気"><div class="forecast-heading"><span>空のうつろい</span><small>今日の24時間</small></div><div class="timeline" id="timeline"><div class="weather-ribbon" id="weather-ribbon"></div><div id="hour-labels"></div><div class="now-marker" id="now-marker"><span id="now-label">いま</span><i></i></div></div><div class="legend"><span><i class="clear"></i>晴</span><span><i class="cloudy"></i>曇</span><span><i class="wet"></i>雨</span></div></aside>
</main>
<dialog id="settings"><form id="search-form"><div class="dialog-heading"><h1>時計の場所</h1><button type="button" id="close-settings" class="icon-button" aria-label="閉じる">×</button></div><p>選んだ街の時刻と空を映します。</p><label for="city">都市名</label><div class="search-row"><input id="city" placeholder="仙台 / Tokyo" autocomplete="off" required minlength="2"><button type="submit">検索</button></div><div id="search-status" role="status"></div><div id="results"></div><p class="setting-note">時刻・日付は端末の時計を使用。月齢は概算です。</p></form></dialog>
<script type="module" src="./src/app.js"></script>
</body></html>
