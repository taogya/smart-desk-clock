<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#122c36" />
    <title>うつろい — Smart Desk Clock</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23edbe78'/%3E%3Cpath d='M32 15V32L44 39' fill='none' stroke='%23122c36' stroke-width='5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css?v=20261011-2" />
  </head>
  <body>
    <main class="clock" id="clock" data-night="true" data-weather="clear">
      <div class="sky" aria-hidden="true">
        <div class="stars"></div>
        <div class="twilight"></div>
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="rain"></div>
        <div class="land land-back"></div>
        <div class="land land-front"></div>
      </div>
      <section class="main-panel">
        <header>
          <div class="brand">
            <a
              class="brand-mark github-link"
              href="https://github.com/taogya/smart-desk-clock"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHubでソースコードを見る（別タブ）"
              title="GitHub · smart-desk-clock"
              ><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.71-4.04-1.58-4.04-1.58-.55-1.36-1.34-1.73-1.34-1.73-1.09-.73.08-.71.08-.71 1.21.08 1.84 1.22 1.84 1.22 1.07 1.8 2.81 1.28 3.5.98.11-.76.42-1.28.76-1.57-2.67-.3-5.47-1.31-5.47-5.83 0-1.29.47-2.34 1.23-3.17-.12-.3-.54-1.52.12-3.16 0 0 1.01-.32 3.3 1.21.96-.26 1.98-.39 3-.4 1.02 0 2.04.14 3 .4 2.28-1.53 3.29-1.21 3.29-1.21.66 1.64.24 2.86.12 3.16.77.83 1.23 1.88 1.23 3.17 0 4.53-2.81 5.52-5.49 5.81.43.36.81 1.09.81 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.68.83.56C20.57 21.88 24 17.48 24 12.29 24 5.78 18.63.5 12 .5z"
                /></svg
            ></a>
            うつろい
            <span class="brand-en">UTSUROI</span>
          </div>
          <div class="controls">
            <button
              id="location-button"
              class="location"
              aria-label="天気の地点を変更"
            >
              <span class="pin"
                ><svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="6" />
                  <path d="M12 1v5m0 12v5M1 12h5m12 0h5" /></svg
              ></span>
              <span id="location-name">仙台</span></button
            ><button
              id="display-settings"
              class="icon-button"
              aria-label="表示設定"
              title="表示設定"
            >
              ⚙</button
            ><button
              id="fullscreen"
              class="icon-button"
              aria-label="全画面表示"
              title="全画面表示"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" />
              </svg>
            </button>
          </div>
        </header>
        <div class="time-block">
          <div id="date" class="date"></div>
          <div class="time-line">
            <time id="time">--:--</time><span id="seconds">--</span>
          </div>
          <div class="seconds-track" aria-hidden="true">
            <div id="seconds-fill"></div>
          </div>
        </div>
        <div class="conditions">
          <span id="weather-icon" class="current-icon"></span>
          <div class="temperature">
            <span id="temperature">--</span><span class="unit">°</span>
          </div>
          <div class="condition-detail">
            <div id="weather-label">天気を取得中</div>
            <div class="high-low">
              <span id="high">↑ --°</span><span id="low">↓ --°</span>
            </div>
          </div>
          <div class="metrics">
            <div class="humidity">
              <span class="drop"
                ><svg viewBox="0 0 24 26" aria-hidden="true">
                  <path
                    d="M12 2C9 7 4 12 4 17a8 8 0 0 0 16 0C20 12 15 7 12 2Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                  /></svg></span
              ><span id="humidity">--</span><small>%</small
              ><span class="metric-label">湿度</span>
            </div>
            <div
              class="pressure-summary"
              id="pressure-summary"
              role="img"
              aria-label="気圧情報を取得中"
              data-trend="steady"
              data-level="unknown"
            >
              <div class="pressure-headline">
                <span class="pressure-reading"
                  ><b id="pressure-value">--</b><small>hPa</small></span
                ><span class="pressure-trend" id="pressure-trend" aria-hidden="true"
                  >→</span>
              </div>
              <span class="pressure-face" id="pressure-face" aria-hidden="true"></span>
            </div>
          </div>
        </div>
        <div class="celestial">
          <div class="sun-section">
            <svg
              id="sun-path"
              viewBox="0 0 560 115"
              role="img"
              aria-label="日の出から日の入りまでの太陽の位置"
            >
              <path d="M24 98 Q280 -68 536 98" class="orbit" />
              <path
                id="sun-progress"
                d="M24 98 Q280 -68 536 98"
                class="orbit-progress"
                pathLength="1"
              />
              <line x1="24" x2="536" y1="98" y2="98" class="horizon" />
              <circle id="sun-dot" cx="24" cy="98" r="8" />
            </svg>
            <div class="sun-labels">
              <span>↗ <b id="sunrise">--:--</b><small>日の出</small></span
              ><span class="day-phase" id="day-phase">夜の時間</span
              ><span>↘ <b id="sunset">--:--</b><small>日の入り</small></span>
            </div>
          </div>
          <div class="moon-section">
            <svg
              id="moon"
              viewBox="-1.1 -1.1 2.2 2.2"
              role="img"
              aria-label="月の満ち欠け"
            >
              <circle r="1" fill="#ffffff18" />
              <path id="moon-light" fill="#eadfc6" />
            </svg>
            <div>
              <span id="moon-name">月</span><small id="moon-age">月齢 --</small>
            </div>
          </div>
        </div>
        <footer>
          <span id="status" role="status">天気を取得しています</span
          ><a href="https://open-meteo.com/" target="_blank" rel="noreferrer"
            >Weather by Open-Meteo ↗</a
          >
        </footer>
      </section>
      <aside class="forecast-panel" aria-label="過去3時間と未来21時間の天気">
        <div class="timeline" id="timeline">
          <div class="timeline-layers" id="timeline-layers"></div>
          <div class="past-shade" aria-hidden="true"></div>
          <div
            class="now-marker"
            id="now-marker"
            role="img"
            aria-label="現在時刻の位置"
          >
            <!-- Compatibility shim for clients that still have the previous app.js cached. -->
            <span id="now-label" hidden aria-hidden="true">いま</span>
            <i aria-hidden="true"></i>
          </div>
        </div>
        <div class="legend">
          <span><i class="clear"></i>晴</span
          ><span><i class="cloudy"></i>曇</span
          ><span><i class="wet"></i>雨</span>
        </div>
      </aside>
    </main>
    <dialog id="settings">
      <form id="search-form">
        <div class="dialog-heading">
          <h1>時計の設定</h1>
          <button
            type="button"
            id="close-settings"
            class="icon-button"
            aria-label="閉じる"
          >
            ×
          </button>
        </div>
        <fieldset class="display-options">
          <legend>見え方</legend>
          <label for="text-size"
            >文字サイズ <output id="text-size-value">100%</output></label
          >
          <input
            type="range"
            id="text-size"
            min="85"
            max="120"
            step="1"
            value="100"
            aria-describedby="text-size-hint"
          />
          <div class="size-presets">
            <button type="button" data-size-preset="85">小さめ</button
            ><button type="button" data-size-preset="100">標準</button
            ><button type="button" data-size-preset="120">大きめ</button>
          </div>
          <p id="text-size-hint" class="setting-note">
            時計・天気・太陽と月の文字をまとめて調整します。
          </p>
          <label for="panel-width"
            >天気欄の幅 <output id="panel-width-value">25%</output></label
          ><input
            type="range"
            id="panel-width"
            min="23"
            max="30"
            step="1"
            value="25"
          /><button type="button" id="reset-display" class="reset-display">
            表示設定を戻す
          </button>
        </fieldset>
        <p>選んだ街の時刻と空を映します。</p>
        <label for="city">都市名</label>
        <div class="search-row">
          <input
            id="city"
            placeholder="仙台 / Tokyo"
            autocomplete="off"
            required
            minlength="2"
          /><button type="submit">検索</button>
        </div>
        <div id="search-status" role="status"></div>
        <div id="results"></div>
        <p class="setting-note">
          時刻・日付は端末の時計を使用。月齢は概算です。
        </p>
      </form>
    </dialog>
    <script type="module" src="./src/app.js?v=20261011-2"></script>
  </body>
</html>
